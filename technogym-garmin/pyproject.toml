[project]
name = "technogym-garmin"
version = "0.1.0"
description = "Passerelle Technogym Mywellness vers montre Garmin (workout structure + app Connect IQ)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "apscheduler>=3.10,<4",
    "garminconnect>=0.3.2",
    "curl_cffi>=0.7",
    "requests>=2.32",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
